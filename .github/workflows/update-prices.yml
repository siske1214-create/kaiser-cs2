name: Update prices

on:
  schedule:
    - cron: '0 6 * * *'   # раз в день в 06:00 UTC (в игре таймер считает от этого же времени)
  workflow_dispatch:       # можно запустить вручную кнопкой Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests brotli
      - run: python scripts/update_prices.py
        env:
          PRICE_FACTOR: '1.25'   # Skinport обычно ~20-30% дешевле Steam; поменяй, если нужно
      - name: Commit prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
