name: Update prices

on:
  schedule:
    - cron: '0 6 * * 1'   # раз в неделю, по понедельникам
  workflow_dispatch:       # можно запустить вручную кнопкой Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests brotli
      - run: python scripts/update_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
